# ============================================
# PRE-COMMIT HOOKS - SÉCURITÉ
# ============================================
# Installation: pip install pre-commit
# Activation: pre-commit install
# ============================================

repos:
  # Détection de secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Vérifications de base
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Empêche les commits sur main
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

      # Vérifie qu'il n'y a pas de gros fichiers
      - id: check-added-large-files
        args: ['--maxkb=500']

      # Vérifie la syntaxe YAML
      - id: check-yaml

      # Vérifie la syntaxe JSON
      - id: check-json

      # Détecte les clés privées
      - id: detect-private-key

      # Vérifie les conflits de merge
      - id: check-merge-conflict

      # Vérifie la syntaxe Python
      - id: check-ast

      # Supprime les espaces en fin de ligne
      - id: trailing-whitespace

      # Assure une ligne vide à la fin des fichiers
      - id: end-of-file-fixer

  # Sécurité Python
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']

  # Formatage Python
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3

  # Linting Python
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203']

  # Vérification des dépendances Python vulnérables
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.2
    hooks:
      - id: python-safety-dependencies-check

  # Tri des imports Python
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile', 'black']
